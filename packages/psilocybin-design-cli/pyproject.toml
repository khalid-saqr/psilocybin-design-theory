[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psilocybin-design-cli"
version = "1.0.0"
description = "Local-first Psilocybin Design genesis CLI for producing agent-readable genesis repositories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Khalid Saqr" }
]
license = { file = "LICENSE" }
keywords = [
  "software design",
  "architecture",
  "genesis repository",
  "coding agents",
  "psilocybin design"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Documentation"
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "Jinja2>=3.1",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "questionary>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1"
]

[project.scripts]
psilocybin = "psilocybin_design_cli.cli:app"

[tool.setuptools.package-data]
psilocybin_design_cli = [
  "schemas/*.json",
  "templates/genesis/*.j2",
  "templates/prompts/*.txt"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
